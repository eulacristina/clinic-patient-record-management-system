
{% extends "base.html" %}

{% block title %}Delete Appointment - Clinic Care{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='delete_appointment.css') }}">
{% endblock %}

{% block content %}

<div class="delete-appointment-page">

    <div class="delete-appointment-card">

        <div class="delete-icon">!</div>

        <p class="delete-label">APPOINTMENT MANAGEMENT</p>

        <h2>Delete Appointment</h2>

        <p class="delete-description">
            Are you sure you want to delete this appointment?
            This action cannot be undone.
        </p>

        <div class="delete-actions">

            <form method="POST"
                  action="{{ url_for('delete_appointment', appointment_id=appointment.appointment_id) }}">

                <button type="submit" class="confirm-delete-btn">
                    Yes, Delete
                </button>

            </form>

            <a href="{{ url_for('appointments') }}" class="cancel-delete-btn">
                Cancel
            </a>

        </div>

    </div>

</div>

{% endblock %}
