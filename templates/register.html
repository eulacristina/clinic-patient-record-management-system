
{% extends "base.html" %}

{% block title %}Register Patient - Clinic Care{% endblock %}

{% block content %}

<div class="register-page">

    <div class="register-header">
        <p>CLINIC MANAGEMENT SYSTEM</p>
        <h2>Register New Patient</h2>
        <span>Enter the patient's information below.</span>
    </div>

    <div class="register-container">

        <div class="form-heading">
            <h3>Patient Information</h3>
            <p>Please complete all required fields.</p>
        </div>

        <form action="/register" method="post" class="patient-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName"
                           placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName"
                           placeholder="Enter last name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age"
                           placeholder="Enter age" min="0" required>
                </div>

                <div class="form-group">
                    <label for="gender">Sex</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Sex</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Details</label>
                    <input type="text" id="contact" name="contact"
                           placeholder="Enter contact details" required>
                </div>

                <div class="form-group">
                    <label for="attendingPhysician">Attending Physician</label>
                    <select id="attendingPhysician" name="attendingPhysician" required>
                        <option value="">Select Physician</option>
                        <option value="Dr. Smith">Dr. Smith</option>
                        <option value="Dr. Johnson">Dr. Johnson</option>
                        <option value="Dr. Williams">Dr. Williams</option>
                    </select>
                </div>

            </div>

            <div class="form-actions">
                <button type="reset" class="reset-btn">Clear Form</button>
                <button type="submit" class="register-btn">Register Patient</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
